<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- iPhone: full-screen, niente zoom-pinch, safe-area sotto il notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a12" />
    <title>iPhone Grattini</title>
    <meta name="description" content="Gratta-e-vinci roguelike per iPhone. 5 unghie, 3 biomi, 1 destino." />
    <meta property="og:title" content="iPhone Grattini" />
    <meta property="og:description" content="Roguelike italiano di gratta-e-vinci, ottimizzato per iPhone." />
    <meta property="og:type" content="website" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html {
        /* dvh = dynamic viewport height: si adatta alla barra Safari che appare/scompare */
        height: 100dvh;
        height: -webkit-fill-available; /* fallback iOS < 15.4 */
      }
      body {
        height: 100%;
        background: #0a0a12;
        /* iPhone: niente bounce-scroll, niente selezione testo accidentale */
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        /* NO padding sul body — il safe-area lo gestiamo nel frame React */
      }
      #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
